<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tambah Anggota — Seni Theatrisic</title>
    <link rel="stylesheet" href="../Assets/css/style.css" />
  </head>
  <body>
    <header>
      <h1>Seni Theatrisic</h1>

      <input type="checkbox" id="menu-toggle" class="menu-checkbox" />
      <label for="menu-toggle" class="hamburger-icon">&#9776;</label>

      <nav>
        <ul>
          <li><a href="../index.html">Beranda</a></li>
          <li><a href="../Seni/list.html">Daftar Seni</a></li>
          <li><a href="../Seni/tambah.html">Tambah Seni</a></li>
          <li><a href="list.html">Daftar Anggota</a></li>
          <li><a href="tambah.html">Tambah Anggota</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section>
        <h2>Tambah Anggota</h2>
        <p class="section-note">Daftarkan anggota baru ke salah satu divisi seni.</p>

        <div class="panel">
          <form action="" method="POST">
            <p>
              <label for="no_anggota">No. Anggota</label>
              <input type="text" name="no_anggota" id="no_anggota" placeholder="Contoh: A003" required />
            </p>
            <p>
              <label for="nama">Nama Lengkap</label>
              <input type="text" name="nama" id="nama" placeholder="Masukkan nama..." required />
            </p>
            <p>
              <label for="divisi">Divisi</label>
              <select id="divisi" name="divisi">
                <option value="theater">Theater</option>
                <option value="psm">PSM (Paduan Suara Mahasiswa)</option>
                <option value="tari">Tari</option>
                <option value="seni_rupa">Seni Rupa</option>
                <option value="band">Band</option>
              </select>
            </p>
            <p>
              <label for="alamat">Alamat</label>
              <input type="text" name="alamat" id="alamat" placeholder="Kota domisili" />
            </p>
            <p>
              <label for="no_hp">No. HP</label>
              <input type="text" name="no_hp" id="no_hp" placeholder="08xxxxxxxxxx" />
            </p>
            <p>
              <button type="submit">Simpan</button>
            </p>
          </form>
        </div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Seni Theatrisic &mdash; Jobsheet 1</p>
    </footer>
  </body>
</html>
