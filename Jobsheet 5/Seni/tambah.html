<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tambah Seni | Seni Theatrisic</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <header>
    <h1>🎭 Seni Theatrisic</h1>
    <input type="checkbox" id="menu-toggle" class="menu-checkbox" style="display:none;"/>
    <label for="menu-toggle" class="hamburger-icon">&#9776;</label>
    <nav>
      <ul>
        <li><a href="../index.html">Beranda</a></li>
        <li><a href="list.html">Daftar Seni</a></li>
        <li><a href="tambah.html">Tambah Seni</a></li>
        <li><a href="../Anggota/list.html">Daftar Anggota</a></li>
        <li><a href="../Anggota/tambah.html">Tambah Anggota</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <h2>Registrasi Divisi Seni Baru</h2>
      <form id="form-seni" onsubmit="simpanSeni(event)">
        <p>
          <label for="no_divisi">Nomor Divisi</label>
          <input type="number" id="no_divisi" placeholder="Contoh: 1" required />
        </p>
        <p>
          <label for="nama_divisi">Nama Divisi</label>
          <input type="text" id="nama_divisi" placeholder="Contoh: Teater Utama" required />
        </p>
        <p>
          <label for="keterangan">Deskripsi / Keterangan</label>
          <input type="text" id="keterangan" placeholder="Masukkan detail singkat divisi..." required />
        </p>
        <p>
          <label for="tahun">Tahun Terbit / Berdiri</label>
          <input type="number" id="tahun" placeholder="Contoh: 2024" required />
        </p>
        <p>
          <button type="submit">💾 Simpan Data Seni</button>
        </p>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Seni Theatrisic &mdash; Sistem Manajemen Organisasi</p>
  </footer>
  <script src="../assets/js/script.js"></script>
</body>
</html>
